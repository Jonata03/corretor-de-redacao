version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  corretor-redacao-api:
    build: ./corretor-redacao-api
    container_name: corretor-redacao-api
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass123
    ports:
      - "8080:8080"
    networks:
      - app-network

  corretor-redacao-app:
    build: corretor-redacao-app
    container_name: corretor-redacao-app
    ports:
      - "5173:80" # se usar Vite ou nginx
    depends_on:
      - corretor-redacao-api
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
